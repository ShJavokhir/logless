[project]
name = "logless-runner"
version = "0.1.0"
description = "logless sandbox runner: executes analysis programs in disposable, network-less gVisor containers (holds no API keys)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
logless-runner = "logless_runner.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logless_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
