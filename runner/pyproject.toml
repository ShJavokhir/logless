[project]
name = "logless-runner"
version = "0.1.0"
description = "logless sandbox runner: executes analysis programs in disposable, network-less gVisor containers (holds no API keys)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
logless-runner = "logless_runner.app:main"

[build-system]
# Pin the build backend and its Python 3.12 dependency closure as well as runtime uv.lock.
requires = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logless_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Prevent a cached local wheel from masking lifecycle or isolation fixes.
cache-keys = [{ file = "pyproject.toml" }, { file = "logless_runner/**/*.py" }]
