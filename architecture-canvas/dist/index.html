    .hint{position:absolute;top:28px;right:28px;color:#888;font-size:12px;z-index:1}.mobile-menu{display:none}
    @media(max-width:900px){.topbar{height:76px;padding:0 16px;gap:10px}.brand{min-width:0}.brand-section,.brand-divider,.top-meta{display:none}.view-tabs{margin-left:auto}.view-tab{padding:9px 11px;font-size:12px}.workspace{grid-template-columns:1fr}.rail{display:none}.canvas-heading{top:19px;left:18px}.canvas-heading h1{font-size:24px}.canvas-heading p{display:none}.hint,.legend{display:none}.controlbar{bottom:16px;left:16px}}

    @media(prefers-reduced-motion:reduce){.detail{transition:none}}
  </style>
