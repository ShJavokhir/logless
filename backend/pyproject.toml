[project]
name = "logless"
version = "0.1.0"
description = "Privacy-preserving usage insights for chat assistants (Clio-style), built for the Vultr Agent Arena"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "scikit-learn>=1.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
logless = "logless.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
